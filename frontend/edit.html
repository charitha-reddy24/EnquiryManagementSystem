<!DOCTYPE html>
<html>
<head>
    <title>Edit Enquiry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Update Enquiry</h1>
    <form id="editForm">
        <input type="hidden" id="enquiry_id">

        <label>First Name:</label>
        <input type="text" id="first_name" required>
        <br><br>

        <label>Last Name:</label>
        <input type="text" id="last_name" required>
        <br><br>

        <label>Mobile:</label>
        <input type="text" id="mobile" required>
        <br><br>

        <label>Email:</label>
        <input type="email" id="email" required>
        <br><br>

        <label>Enquiry Details:</label>
        <textarea id="enquiry_details" placeholder="Enter your enquiry details" required></textarea>
        <br><br>

        <button type="submit">Update Enquiry</button>
    </form>

    <button onclick="window.location.href='view.html'">Back to Enquiries</button>

    <script src="edit.js"></script>
</body>
</html>
