<!DOCTYPE html>
<html>
<head>
    <title>Enquiry Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Enquiry Management System</h1>
    <h2>Enquiry Form</h2>
    <form>

        <label>First Name:</label>
        <input type="text" id="first_name" placeholder="Enter first name">
        <br><br>

        <label>Last Name:</label>
        <input type="text" id="last_name" placeholder="Enter last name">
        <br><br>

        <label>Mobile Number:</label>
        <input type="text" id="mobile" placeholder="Enter mobile number">
        <br><br>

        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter email">
        <br><br>
        <button type="submit">Submit Enquiry</button>

    </form>

    <h3>Enquiry List</h3>
    <!-- SEARCH BOX -->

<input
    type="text"
    id="searchInput"
    placeholder="Search by name, mobile or email"
>
<button type="button" onclick="searchEnquiries()">Search</button>
<button type="button" onclick="showAllEnquiries()">Show All</button>


<!-- ENQUIRY TABLE -->

    
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Mobile</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="enquiryTable">
        </tbody>
    </table>
    <script src="script.js"></script>
</body>
</html>
