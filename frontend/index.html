<!DOCTYPE html>
<html>
<head>
    <title>Enquiry Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Enquiry Management System</h1>
    <h2>Submit Enquiry</h2>
    <form id="enquiryForm">
        <label>First Name:</label>
        <input type="text" id="first_name" placeholder="Enter first name" required>
        <br><br>
        <label>Last Name:</label>
        <input type="text" id="last_name" placeholder="Enter last name" required>
        <br><br>
        <label>Mobile Number:</label>
        <input type="text" id="mobile" placeholder="Enter mobile number" required>
        <br><br>
        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter email" required>
        <br><br>
        <label>Enquiry Details:</label>
        <textarea id="enquiry_details" placeholder="Enter your enquiry details" required></textarea>
        <br><br>
        <button type="submit">Submit Enquiry</button>
    </form>
    <hr>
    <h2>Manage Enquiries</h2>
    <button onclick="window.location.href='view.html'">View All Enquiries</button>
    <button onclick="window.location.href='search.html'">Search Enquiries</button>
    <script src="script.js"></script>
</body>
</html>
