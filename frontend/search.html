<!DOCTYPE html>
<html>
<head>
    <title>Search Enquiries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Search Enquiries</h1>

    <button onclick="window.location.href='index.html'">Home</button>
    <br><br>

    <input type="text" id="searchInput" placeholder="Search by name, mobile, email or enquiry details">
    <button onclick="searchEnquiries()">Search</button>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Mobile</th>
                <th>Email</th>
                <th>Enquiry Details</th>
            </tr>
        </thead>
        <tbody id="enquiryTable"></tbody>
    </table>

    <script src="search.js"></script>
</body>
</html>
